# Checks only: nothing here touches Oracle Cloud or holds credentials.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  ansible:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ansible-core==2.18.*" "ansible-lint==26.*"
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint
      - run: ansible-playbook site.yml --syntax-check

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  apps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Looking glass unit tests
        run: python -m unittest discover -s apps/lg -v
