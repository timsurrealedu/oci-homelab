# Control node = edge (Ansible doesn't run on native Windows). Worker is reached over the private subnet.
all:
  vars:
    ansible_user: ubuntu
  children:
    edge_hosts:
      hosts:
        edge:
          ansible_connection: local
    monitoring_hosts:  # moves to the worker once it exists
      hosts:
        edge:
    worker_hosts:
      hosts:
        worker:
          ansible_host: 10.0.1.10
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ansible
