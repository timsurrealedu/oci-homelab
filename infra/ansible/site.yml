- name: Baseline for all servers
  hosts: all
  roles:
    - base
    - ssh
    - firewall
    - docker
    - tailscale
    - node_exporter

- name: Monitoring stack
  hosts: monitoring_hosts
  roles:
    - monitoring

- name: Apps and public entry (Caddy)
  hosts: edge_hosts
  roles:
    - apps
    - caddy
