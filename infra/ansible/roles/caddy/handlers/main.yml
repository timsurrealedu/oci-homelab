- name: Recreate caddy
  ansible.builtin.command: docker compose up -d --force-recreate
  args:
    chdir: "{{ caddy_dir }}"
  changed_when: true

- name: Reload caddy
  ansible.builtin.command: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
  args:
    chdir: "{{ caddy_dir }}"
  changed_when: true
