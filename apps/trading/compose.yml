# Deployed by Ansible (roles/apps). Host network so it can reach freqtrade's API on 127.0.0.1:8080;
# it listens on 127.0.0.1:8092 only and is reached through Caddy (:8093 today, trading.<domain> later).
name: trading

services:
  trading:
    build: .
    image: oci-homelab/trading:local
    restart: unless-stopped
    network_mode: host
    env_file: /etc/oci-homelab/secrets/trading.env   # FT_USER / FT_PASS, written by roles/apps from freqtrade's config
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 32
